<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>打印配色核对</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <select id="sources" data-label="sources"></select>
    <button id="refresh" data-text="refresh" data-title="refreshTip"></button>
    <button id="open" data-text="open"></button>
    <select id="language" data-label="language" data-title="language">
      <option value="zh" lang="zh-CN">简体中文</option>
      <option value="en" lang="en">English</option>
    </select>
    <button id="aboutButton" data-text="about" aria-haspopup="dialog" aria-controls="aboutPage"></button>
  </header>
  <main>
    <nav>
      <div class="tabs">
        <button data-mode="three" data-text="ams"></button>
        <button data-mode="design" data-text="design"></button>
        <button data-mode="plate" data-text="plate"></button>
      </div>
      <span class="grow"></span>
      <button id="capture" data-text="readAMS"></button>
      <button id="shot" data-text="importShot"></button>
      <select id="format" data-label="format">
        <option value="pair" data-text="compare4K"></option>
        <option value="one" data-text="actual4K"></option>
      </select>
      <button id="save" data-text="save"></button>
    </nav>
    <div id="stage">
      <canvas id="gl" data-label="model"></canvas>
      <div id="photo"><img id="picture" draggable="false" data-alt="plateImage"></div>
      <div id="empty"></div>
      <button id="flag" hidden data-title="frameTip"></button>
      <div id="actions">
        <button id="full" data-text="full"></button>
        <button id="minus" data-title="out" data-label="out">−</button>
        <button id="home" data-text="reset" data-title="resetTip"></button>
        <button id="plus" data-title="in" data-label="in">＋</button>
      </div>
    </div>
    <footer>
      <div id="summary"></div><div id="hint"></div><div id="status" role="status"></div>
      <div id="colors" hidden><span id="colorLabel"></span><div id="swatches"></div><button id="restore" hidden data-text="all"></button></div>
    </footer>
  </main>
  <dialog id="aboutPage" aria-labelledby="aboutTitle">
    <div class="about-heading">
      <img src="AboutIcon.png" alt="" width="72" height="72">
      <div><h1 id="aboutTitle" data-text="appName"></h1><p id="aboutVersion"></p></div>
      <form method="dialog"><button data-text="close" autofocus></button></form>
    </div>
    <p class="about-intro" data-text="aboutIntro"></p>
    <h2 data-text="howTo"></h2>
    <ol class="about-steps"><li data-text="stepSlice"></li><li data-text="stepMap"></li><li data-text="stepInspect"></li><li data-text="stepSave"></li></ol>
    <p class="about-support" data-text="compatibility"></p>
    <div class="about-links">
      <a href="https://github.com/zouxiao7777/BambuPrintColorCheck/releases" data-text="downloads"></a>
      <a href="https://github.com/zouxiao7777/BambuPrintColorCheck" data-text="sourceCode"></a>
      <a href="https://github.com/zouxiao7777/BambuPrintColorCheck/issues" data-text="feedback"></a>
    </div>
    <p class="about-contact"><span data-text="contact"></span> <a href="https://github.com/zouxiao7777">@zouxiao7777</a></p>
  </dialog>
  <script src="language.js"></script><script src="viewer.js"></script><script src="app.js"></script>
</body>
</html>
